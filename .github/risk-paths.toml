# Path list of the risk gate (EPIC-11 spec, section 2.12; development-flow.md, section 2.1).
#
# A changed path's level is the highest level of the rules that match it. A path no rule matches
# counts as High. The flow checks also treat this file, `.github/workflows/**`, every `CLAUDE.md`,
# and `.claude/agents/**` as High, whatever it says.
#
# Globs are matched from the repository root: `*` stays in one folder, `**` crosses folders.

[[rule]]
glob = ".github/**"
level = "High"
reason = "CI, the flow checks, and this path list"

[[rule]]
glob = "**/CLAUDE.md"
level = "High"
reason = "Rules every agent follows"

[[rule]]
glob = ".claude/**"
level = "High"
reason = "Agent roles and settings"

[[rule]]
glob = "pubspec.yaml"
level = "High"
reason = "Dependencies and the pinned Flutter version"

[[rule]]
glob = "pubspec.lock"
level = "High"
reason = "Locked dependencies"

[[rule]]
glob = "CONTRACTS_VERSION"
level = "High"
reason = "The pinned contract every generated file comes from"

[[rule]]
glob = "CONTRACTS_SHA"
level = "High"
reason = "The commit the pinned contract tag must resolve to"

[[rule]]
glob = "tool/**"
level = "High"
reason = "The generator and its checks"

[[rule]]
glob = "android/**"
level = "High"
reason = "Native Android build and flavors"

[[rule]]
glob = "ios/**"
level = "High"
reason = "Native iOS build, flavors, and signing"

[[rule]]
glob = ".gitattributes"
level = "High"
reason = "Line endings the checks compare"

[[rule]]
glob = "analysis_options.yaml"
level = "High"
reason = "Lint rules that CI enforces"

[[rule]]
glob = "lib/core/**"
level = "High"
reason = "API client, request headers, device identity, and the mock: every call goes through them"

[[rule]]
glob = "**/flutter_test_config.dart"
level = "High"
reason = "Runs before every test file; it can change what the tests do"

[[rule]]
glob = "**/dart_test.yaml"
level = "High"
reason = "Test runner configuration (timeouts, tags, skips)"

[[rule]]
glob = "contracts/**"
level = "Low"
reason = "Generated copy of the pinned contract; the Contracts check guards it"

[[rule]]
glob = "packages/tripmate_api/**"
level = "Low"
reason = "Generated client; the Contracts check guards it"

[[rule]]
glob = "lib/l10n/**"
level = "Low"
reason = "Generated translations; the Contracts check guards them"

[[rule]]
glob = "l10n.yaml"
level = "Low"
reason = "Generated by the tool; the Contracts check guards it"

[[rule]]
glob = "lib/**"
level = "Low"
reason = "App code; its tests and the diff review guard it"

[[rule]]
glob = "test/**"
level = "Low"
reason = "Tests are locked by the test-lock check"

[[rule]]
glob = "tasks/**"
level = "Low"
reason = "Task files"

[[rule]]
glob = "README.md"
level = "Low"
reason = "Documentation"

[[rule]]
glob = ".gitignore"
level = "Low"
reason = "Ignored files"
