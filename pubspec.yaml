name: tripmate_mobile
description: "TripMate Mobile client for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

# Flutter is pinned to one version on every machine and in CI
# (EPIC-11 spec, section 2.11). Both lines are exact: pub refuses to
# resolve with any other Dart SDK or Flutter version, older or newer, and
# every flutter command (pub get, analyze, test, run, build) resolves
# first. Flutter 3.38.5 ships Dart 3.10.4. Change both lines and
# FLUTTER_VERSION in .github/workflows/ci.yml together.
environment:
  sdk: 3.10.4
  flutter: 3.38.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
